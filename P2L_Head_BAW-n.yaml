# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (standard, no ODCA)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4 features
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8 features
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16 features
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32 features
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# P2L-Head + BAW_Concat (no ODCA)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: P5→P4/16
  - [[-1, 6], 1, BAW_Concat, [1]] # 12: cat backbone P4 (层6=C3k2 P4/16)
  - [-1, 2, C3k2, [512, False]] # 13: head P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14: P4→P3/8
  - [[-1, 4], 1, BAW_Concat, [1]] # 15: cat backbone P3 (层4=C3k2 P3/8)
  - [-1, 2, C3k2, [256, False]] # 16: head P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17: P3→P2/4
  - [[-1, 2], 1, BAW_Concat, [1]] # 18: cat backbone P2 (层2=C3k2 P2/4)
  - [-1, 2, C3k2, [128, False]] # 19: head P2 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 20: P2→P3/8
  - [[-1, 16], 1, BAW_Concat, [1]] # 21: cat head P3 (层16=C3k2 P3/8)
  - [-1, 2, C3k2, [256, False]] # 22: P3 fusion

  - [-1, 1, Conv, [256, 3, 2]] # 23: P3→P4/16
  - [[-1, 13], 1, BAW_Concat, [1]] # 24: cat head P4 (层13=C3k2 P4/16)
  - [-1, 2, C3k2, [512, False]] # 25: P4 fusion (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26: P4→P5/32
  - [[-1, 10], 1, BAW_Concat, [1]] # 27: cat head P5 (层10=C2PSA P5/32)
  - [-1, 2, C3k2, [1024, True]] # 28: P5 fusion (P5/32-large)

  - [[19, 25, 28], 1, Detect, [nc]] # Detect(P2, P4, P5)
